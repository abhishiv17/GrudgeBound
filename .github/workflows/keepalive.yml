# The hosted game server runs on a free plan that sleeps after 15 idle minutes; a sleeping server takes up to a
# minute to answer, longer than the game waits. This pings /health every 10 minutes through judging (until 25 Nov).
name: Keep the hosted server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261125 ]; then echo "Judging is over; nothing to do."; exit 0; fi
          curl -fsS --max-time 90 --retry 2 https://grudgebound-server.onrender.com/health
